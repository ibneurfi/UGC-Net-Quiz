<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC NET LIS - Dynamic Mock Test</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #172033; background: #eef2ff; color-scheme: light; }
        :root.dark { color: #e5e7eb; background: #0b1120; color-scheme: dark; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: flex; flex-direction: column; margin: 0; padding: 32px 16px 18px; background: radial-gradient(circle at top left, #dbeafe, transparent 40%), #eef2ff; transition: background .3s, color .3s; }
        .dark body { background: radial-gradient(circle at top left, #1e3a5f, transparent 38%), #0b1120; }
        .quiz-card { width: 100%; max-width: 760px; margin: auto; padding: 32px; background: rgba(255,255,255,.95); border: 1px solid #e0e7ff; border-radius: 24px; box-shadow: 0 20px 60px rgba(49, 46, 129, .14); }
        .dark .quiz-card { color: #f8fafc; background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.25); box-shadow: 0 20px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .dark select, .dark .option, .dark .result-stat { color: #f8fafc; background: rgba(15,23,42,.58); border-color: rgba(255,255,255,.2); }
        .dark .option:hover:not(:disabled) { color: #c4b5fd; background: rgba(79,70,229,.3); }
        .dark .subtitle, .dark .quiz-meta, .dark .footer, .dark .result-stat span { color: #9ca3af; }
        .dark .timer { background: rgba(49,46,129,.72); color: #e0e7ff; }
        .theme-toggle { position: fixed !important; top: 20px !important; right: 20px !important; left: auto !important; bottom: auto !important; z-index: 2147483647; width: 46px; min-height: 40px; padding: 7px; border: 1px solid rgba(99,102,241,.35); border-radius: 99px; background: rgba(255,255,255,.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; font-size: 20px; transition: .2s; }
        .theme-toggle:hover { transform: rotate(12deg) scale(1.08); }
        .brand { margin: 0 0 6px; color: #4f46e5; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #e5e7eb; }
        h2 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -.04em; }
        .subtitle { margin: 8px 0 0; color: #64748b; }
        .timer { display: none; min-width: 116px; padding: 11px 14px; color: #4338ca; background: #eef2ff; border-radius: 12px; font-size: 19px; font-weight: 800; text-align: center; }
        .timer.visible { display: block; }
        .timer.warning { color: #b91c1c; background: #fee2e2; }
        .controls { display: flex; gap: 12px; margin: 24px 0 12px; }
        select, button { min-height: 46px; padding: 11px 15px; border-radius: 11px; border: 1px solid #d7dce8; font: inherit; }
        select { flex: 1; min-width: 0; color: #334155; background: white; }
        .btn { color: white; background: #4f46e5; border: none; cursor: pointer; font-weight: 750; transition: .2s; }
        .btn:hover { background: #4338ca; transform: translateY(-1px); }
        .btn:disabled { background: #a5b4fc; cursor: not-allowed; transform: none; }
        .loader { display: none; margin: 15px 0; color: #4f46e5; font-weight: 700; }
        .quiz-meta { display: flex; justify-content: space-between; margin: 18px 0 8px; color: #64748b; font-size: 14px; font-weight: 700; }
        .progress { height: 8px; overflow: hidden; background: #e2e8f0; border-radius: 99px; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width .3s; }
        #question-text { margin: 26px 0 20px; line-height: 1.45; }
        .option { display: block; width: 100%; margin: 10px 0; color: #334155; background: #f8fafc; cursor: pointer; text-align: left; transition: .2s; }
        .option:hover:not(:disabled) { color: #4338ca; border-color: #818cf8; background: #eef2ff; transform: translateX(3px); }
        .option:disabled { cursor: default; opacity: .85; }
        .explanation { margin-top: 18px; padding: 15px; color: #334155; background: #f0fdf4; border-left: 4px solid #22c55e; display: none; border-radius: 8px; line-height: 1.5; }
        .question-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
        .question-actions { justify-content: space-between; gap: 10px; }
        .skip-btn { color: #64748b; background: white; cursor: pointer; }
        .skip-btn:hover { color: #4338ca; border-color: #818cf8; }
        .submit-btn { color: #b91c1c; background: #fff1f2; border-color: #fecdd3; cursor: pointer; }
        .submit-btn:hover { background: #ffe4e6; }
        .hidden { display: none !important; }
        .active-topic { display: none; margin: 18px 0 -4px; color: #4f46e5; font-size: 14px; font-weight: 800; }
        .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
        .review { margin-top: 28px; text-align: left; }
        .review-item { margin: 12px 0; padding: 15px; background: #fff7ed; border-left: 4px solid #f97316; border-radius: 10px; }
        .unit-performance { display: grid; gap: 10px; margin-top: 12px; text-align: left; }
        .unit-row { padding: 12px; background: #f8fafc; border-radius: 10px; }
        .unit-row header { display: flex; justify-content: space-between; margin-bottom: 7px; color: #475569; font-size: 13px; font-weight: 700; }
        .unit-bar { height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
        .unit-bar i { display: block; height: 100%; background: #6366f1; }
        .review-pages { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; }
        .review-pages button { min-width: 40px; padding: 8px 12px; cursor: pointer; }
        .review-pages button.active { color: white; background: #4f46e5; border-color: #4f46e5; }
        .practice-link { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 11px; font-weight: 750; text-decoration: none; transition: .2s; }
        .practice-link:hover { color: white; background: #16a34a; border-color: #16a34a; transform: translateY(-1px); }
        .dark .practice-link { color: #86efac; background: #14532d; border-color: #166534; }
        .results { text-align: center; }
        .results h3 { margin: 8px 0; font-size: 28px; }
        .result-circle { --result: 0%; display: grid; place-items: center; width: 178px; height: 178px; margin: 24px auto 18px; border-radius: 50%; background: conic-gradient(#6366f1 var(--result), #e2e8f0 0); }
        .result-circle::after { content: ""; grid-area: 1 / 1; width: 136px; height: 136px; border-radius: 50%; background: white; }
        .result-value { z-index: 1; grid-area: 1 / 1; color: #3730a3; font-size: 34px; font-weight: 850; }
        .result-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 22px 0; }
        .result-stat { padding: 14px; background: #f8fafc; border-radius: 12px; }
        .result-stat strong { display: block; color: #312e81; font-size: 22px; }
        .result-stat span { color: #64748b; font-size: 13px; }
        footer { max-width: 760px; margin: 24px auto 0; color: #94a3b8; font-size: 13px; text-align: center; }
        @media (max-width: 560px) { body { padding: 12px 8px; } .quiz-card { padding: 22px 18px; border-radius: 18px; } .header { flex-direction: column; } .timer { align-self: stretch; } .controls { flex-direction: column; } }
    </style>
</head>
<body>

<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" onclick="toggleTheme()">☀️</button>
<div class="quiz-card">
    <div class="header">
        <div>
            <p class="brand">Smart Mock Test</p>
            <h2>UGC NET LIS Quiz</h2>
            <p class="subtitle">Practice with Library & Information Science questions.</p>
        </div>
        <div class="timer">Time: <span id="time">120:00</span></div>
    </div>

    <div id="quiz-setup" class="controls">
        <select id="topic-select">
            <option value="Paper 2 : LIS (All Topics)">Paper 2 : LIS (All Topics)</option>
            <option value="Unit 1">Unit 1</option>
            <option value="Unit 2">Unit 2</option>
            <option value="Unit 3">Unit 3</option>
            <option value="Unit 4">Unit 4</option>
            <option value="Unit 5">Unit 5</option>
            <option value="Unit 6">Unit 6</option>
            <option value="Unit 7">Unit 7</option>
            <option value="Unit 8">Unit 8</option>
            <option value="Unit 9">Unit 9</option>
            <option value="Unit 10">Unit 10</option>
        </select>
        <button id="generate-btn" class="btn" onclick="startQuiz()">Start Quiz</button>
        <a class="practice-link" href="/practice.html">Practice Mode (∞)</a>
    </div>

    <div id="loader" class="loader">Loading questions...</div>

    <div id="quiz-body" style="display:none;">
        <div id="active-topic" class="active-topic"></div>
        <div class="quiz-meta"><span id="progress-text">Question 1 of 100</span><span id="attempted-text">Attempted: 0</span></div>
        <div class="progress"><div id="progress-bar"></div></div>
        <h3 id="question-text">Question will appear here...</h3>
        <div id="options-container"></div>
        <div id="explanation" class="explanation"></div>
        <div class="question-actions"><button id="skip-btn" class="skip-btn" onclick="skipQuestion()">Skip Question</button><button id="submit-btn" class="submit-btn" onclick="submitQuiz()">Submit Quiz</button><button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">Next Question</button></div>
    </div>
</div>
<footer>Made with <span aria-label="love">❤️</span> by Khalid Saifullah</footer>

<script>
    let questions = [];
    let currentQ = 0;
    let score = 0;
    let attempted = 0;
    let skipped = 0;
    let currentTopic = "";
    let timerInterval = null;
    let quizStartedAt = 0;
    let reviewPage = 0;
    const QUESTION_LIMIT = 100;
    const QUIZ_DURATION_SECONDS = 120 * 60;
    let theme = localStorage.getItem("ugc-theme") || "light";
    applyTheme();

    async function startQuiz() {
        const topic = document.getElementById("topic-select").value;
        const loader = document.getElementById("loader");
        const quizBody = document.getElementById("quiz-body");
        const generateBtn = document.getElementById("generate-btn");
        currentTopic = topic;

        document.getElementById("quiz-setup").classList.add("hidden");
        document.getElementById("active-topic").innerText = topic;
        document.getElementById("active-topic").style.display = "block";
        loader.style.display = "block";
        quizBody.style.display = "none";
        generateBtn.disabled = true;

        try {
            const response = await fetch("question-bank.json");

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `Request failed (${response.status})`);
            }
            const availableQuestions = topic === "Paper 2 : LIS (All Topics)"
                ? data
                : data.filter(question => question.unit === topic);
            if (!Array.isArray(availableQuestions) || availableQuestions.length === 0) {
                throw new Error("The local question bank has no questions for this selection.");
            }

            questions = shuffle(availableQuestions).slice(0, QUESTION_LIMIT);
            questions.forEach(question => question.status = "unanswered");
            currentQ = 0;
            score = 0;
            attempted = 0;
            skipped = 0;
            quizStartedAt = Date.now();
            
            loader.style.display = "none";
            quizBody.style.display = "block";
            generateBtn.disabled = false;
            document.querySelector(".timer").classList.add("visible");
            startTimer(QUIZ_DURATION_SECONDS);
            loadQuestion();

        } catch (error) {
            console.error(error);
            alert(`Error generating questions: ${error.message}`);
            loader.style.display = "none";
            generateBtn.disabled = false;
            document.getElementById("quiz-setup").classList.remove("hidden");
            document.getElementById("active-topic").style.display = "none";
        }
    }

    function loadQuestion() {
        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("skip-btn").style.display = "inline-block";
        document.getElementById("submit-btn").style.display = "inline-block";
        
        let qData = questions[currentQ];
        document.getElementById("progress-text").innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById("attempted-text").innerText = `Attempted: ${attempted}`;
        document.getElementById("progress-bar").style.width = `${(currentQ / questions.length) * 100}%`;
        document.getElementById("question-text").innerText = `Q${currentQ + 1}. ${qData.q}`;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        qData.options.forEach((opt, idx) => {
            const button = document.createElement("button");
            button.className = "option";
            button.type = "button";
            button.innerText = opt;
            button.onclick = () => checkAnswer(idx);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIdx) {
        let qData = questions[currentQ];
        let expBox = document.getElementById("explanation");
        
        if (selectedIdx === qData.correct) {
            score += 2;
            expBox.innerText = `Correct! ${qData.exp}`;
            expBox.style.borderColor = "#4CAF50";
        } else {
            score -= 0.25;
            expBox.innerText = `Incorrect. ${qData.exp}`;
            expBox.style.borderColor = "#f44336";
        }
        attempted++;
        qData.status = selectedIdx === qData.correct ? "correct" : "incorrect";
        qData.selected = selectedIdx;
        expBox.style.display = "block";
        document.getElementById("attempted-text").innerText = `Attempted: ${attempted}`;
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("skip-btn").style.display = "none";
        
        let btns = document.querySelectorAll(".option");
        btns.forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            finishQuiz("Quiz completed!");
        }
    }

    function skipQuestion() {
        skipped++;
        questions[currentQ].status = "skipped";
        nextQuestion();
    }

    function submitQuiz() {
        if (confirm("Submit the quiz now? Unanswered questions will be counted as unanswered.")) {
            finishQuiz("Quiz submitted!");
        }
    }

    function finishQuiz(title) {
        clearInterval(timerInterval);
        document.querySelector(".timer").classList.remove("visible");
        const percentage = Math.max(0, Math.round((score / (questions.length * 2)) * 100));
        const correctCount = questions.filter(question => question.status === "correct").length;
        const attended = attempted + skipped;
        const accuracy = attended ? Math.round((correctCount / attended) * 100) : 0;
        const elapsedSeconds = Math.min(QUIZ_DURATION_SECONDS, Math.floor((Date.now() - quizStartedAt) / 1000));
        const elapsedTime = `${Math.floor(elapsedSeconds / 60)}:${String(elapsedSeconds % 60).padStart(2, "0")}`;
        document.getElementById("progress-bar").style.width = "100%";
        const unitStats = getUnitStats();
        const incorrect = questions.filter(question => question.status === "incorrect");
        const reviewMarkup = incorrect.length ? '<div id="review-section" class="review"></div>' : "";
        reviewPage = 0;
        document.getElementById("quiz-body").innerHTML = `
            <div class="results">
                <div class="result-circle" style="--result:${percentage}%"><div class="result-value">${percentage}%</div></div>
                <h3>${title}</h3>
                <p>Your result is ready. Review your performance below.</p>
                <div class="result-stats">
                    <div class="result-stat"><strong>${score.toFixed(2)} / ${questions.length * 2}</strong><span>UGC NET marks</span></div>
                    <div class="result-stat"><strong>${correctCount}</strong><span>Correct answered</span></div>
                    <div class="result-stat"><strong>${accuracy}%</strong><span>Accuracy (${attended} attended)</span></div>
                    <div class="result-stat"><strong>${skipped}</strong><span>Skipped</span></div>
                    <div class="result-stat"><strong>${questions.length - attempted - skipped}</strong><span>Unanswered</span></div>
                    <div class="result-stat"><strong>${elapsedTime}</strong><span>Time spent</span></div>
                </div>
                <div class="result-actions">
                    <button class="btn" onclick="restartQuiz()">Start Quiz</button>
                    <button class="skip-btn" onclick="location.reload()">Try Another Topic</button>
                    <button class="skip-btn" onclick="downloadResult(${percentage}, ${accuracy})">Download Result</button>
                    <button class="skip-btn" onclick="shareResult(${percentage}, ${accuracy})">Share Result</button>
                </div>
                <h3>Unit-wise performance</h3>
                <div class="unit-performance">${unitStats}</div>
                ${reviewMarkup}
            </div>
        `;
        if (incorrect.length) renderReview(incorrect);
    }

    function renderReview(incorrect) {
        const review = document.getElementById("review-section");
        if (!review) return;
        if (!incorrect.length) {
            review.innerHTML = "<h3>Review incorrect answers</h3><p>Excellent! You have no incorrect answers to review.</p>";
            return;
        }
        const pageCount = Math.ceil(incorrect.length / 3);
        const pageQuestions = incorrect.slice(reviewPage * 3, reviewPage * 3 + 3);
        review.innerHTML = `<h3>Review incorrect answers</h3>${pageQuestions.map((question, index) => `
            <div class="review-item"><strong>${reviewPage * 3 + index + 1}. ${escapeHtml(question.q)}</strong><p>Your answer: ${escapeHtml(question.options[question.selected] || "Not answered")}</p><p>Correct answer: ${escapeHtml(question.options[question.correct])}</p><p>${escapeHtml(question.exp)}</p></div>
        `).join("")}<div class="review-pages">${Array.from({ length: pageCount }, (_, page) => `<button class="${page === reviewPage ? "active" : ""}" onclick="showReviewPage(${page})">${page + 1}</button>`).join("")}</div>`;
    }

    function showReviewPage(page) {
        reviewPage = page;
        renderReview(questions.filter(question => question.status === "incorrect"));
    }

    function getUnitStats() {
        const units = {};
        questions.forEach(question => {
            if (question.status === "unanswered") return;
            const unit = question.unit || "General LIS";
            if (!units[unit]) units[unit] = { total: 0, correct: 0 };
            units[unit].total++;
            if (question.status === "correct") units[unit].correct++;
        });
        if (!Object.keys(units).length) return "<p>No questions were answered or skipped.</p>";
        return Object.entries(units).map(([unit, stats]) => {
            const percent = Math.round((stats.correct / stats.total) * 100);
            return `<div class="unit-row"><header><span>${escapeHtml(unit)}</span><span>${stats.correct}/${stats.total} (${percent}%)</span></header><div class="unit-bar"><i style="width:${percent}%"></i></div></div>`;
        }).join("");
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character]));
    }

    function downloadResult(percentage, accuracy) {
        const canvas = document.createElement("canvas");
        canvas.width = 900; canvas.height = 520;
        const context = canvas.getContext("2d");
        context.fillStyle = "#eef2ff"; context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#312e81"; context.font = "bold 42px system-ui"; context.fillText("UGC NET LIS Quiz Result", 55, 85);
        context.fillStyle = "#4f46e5"; context.font = "bold 110px system-ui"; context.fillText(`${percentage}%`, 55, 245);
        context.fillStyle = "#334155"; context.font = "28px system-ui";
        context.fillText(`Marks: ${score.toFixed(2)} / ${questions.length * 2}`, 55, 320);
        context.fillText(`Accuracy: ${accuracy}% (${attempted} attempted)`, 55, 370);
        context.fillText(currentTopic.replace(" - all ten units of the UGC NET Library and Information Science syllabus", ""), 55, 440);
        const link = document.createElement("a"); link.download = "ugc-net-lis-result.png"; link.href = canvas.toDataURL(); link.click();
    }

    async function shareResult(percentage, accuracy) {
        const text = `UGC NET LIS Quiz: ${percentage}% score, ${accuracy}% accuracy.`;
        if (navigator.share) await navigator.share({ title: "UGC NET LIS Result", text });
        else await navigator.clipboard.writeText(text);
        alert(navigator.share ? "Result shared." : "Result copied to clipboard.");
    }

    function toggleTheme() {
        theme = theme === "dark" ? "light" : "dark";
        applyTheme();
        localStorage.setItem("ugc-theme", theme);
    }

    function applyTheme() {
        document.documentElement.classList.toggle("dark", theme === "dark");
        const toggle = document.getElementById("theme-toggle");
        toggle.innerText = theme === "dark" ? "🌙" : "☀️";
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
        toggle.style.position = "fixed";
        toggle.style.top = "20px";
        toggle.style.right = "20px";
        toggle.style.left = "auto";
        toggle.style.bottom = "auto";
        toggle.style.zIndex = "1000";
    }

    function restartQuiz() {
        document.getElementById("quiz-body").innerHTML = `
            <div id="active-topic" class="active-topic"></div>
            <div class="quiz-meta"><span id="progress-text">Question 1 of 100</span><span id="attempted-text">Attempted: 0</span></div>
            <div class="progress"><div id="progress-bar"></div></div>
            <h3 id="question-text">Question will appear here...</h3>
            <div id="options-container"></div>
            <div id="explanation" class="explanation"></div>
            <div class="question-actions"><button id="skip-btn" class="skip-btn" onclick="skipQuestion()">Skip Question</button><button id="submit-btn" class="submit-btn" onclick="submitQuiz()">Submit Quiz</button><button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">Next Question</button></div>
        `;
        document.getElementById("quiz-body").style.display = "none";
        document.querySelector(".timer").classList.remove("visible");
        startQuiz();
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        let timeLeft = seconds;
        updateTimer(timeLeft);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishQuiz("Time's up!");
                return;
            }
            timeLeft--;
            updateTimer(timeLeft);
        }, 1000);
    }

    function updateTimer(timeLeft) {
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        const timer = document.querySelector(".timer");
        document.getElementById("time").innerText = `${min}:${sec < 10 ? "0" : ""}${sec}`;
        timer.classList.toggle("warning", timeLeft <= 300);
    }

    function shuffle(items) {
        const shuffled = [...items];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
</script>

</body>
</html>
